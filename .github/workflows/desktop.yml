name: Desktop
on:
  pull_request:
  push:
    branches: [main, "feat/**"]
permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, os: linux, arch: amd64, runner_arch: X64 }
          - { runner: windows-2025, os: windows, arch: amd64, runner_arch: X64 }
          - { runner: macos-26, os: darwin, arch: arm64, runner_arch: ARM64 }
          - { runner: macos-26-intel, os: darwin, arch: amd64, runner_arch: X64 }
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          check-latest: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check the native runner and toolchain
        run: |
          test "$RUNNER_ARCH" = "${{ matrix.runner_arch }}"
          test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = "${{ matrix.os }}/${{ matrix.arch }}"
          go version
          node --version
          npm --version
      - name: Install GTK and WebKitGTK development files
        if: runner.os == 'Linux'
        run: bash scripts/setup-linux.sh
      - name: Check Windows C compiler
        if: runner.os == 'Windows'
        run: |
          gcc --version
          gcc -dumpmachine | grep -E '^x86_64-w64-mingw32'
      - name: Check UI, language resources and Go
        run: bash scripts/check.sh
      - name: Exercise the bilingual workspace in Chromium
        if: runner.os == 'Linux'
        run: |
          python3 -m venv "$RUNNER_TEMP/s3s-ui"
          "$RUNNER_TEMP/s3s-ui/bin/python" -m pip install playwright==1.62.0
          "$RUNNER_TEMP/s3s-ui/bin/python" tests/ui/preview.py
      - name: Build native desktop archive
        run: bash scripts/build.sh
      - name: Exercise the packaged Linux desktop and isolated storage services
        if: runner.os == 'Linux'
        run: |
          stage=$(mktemp -d)
          tar -xzf "dist/s3s-linux-amd64-$GITHUB_SHA.tar.gz" -C "$stage"
          docker build -t s3s-m0-linux:local -f scripts/Dockerfile.linux scripts
          bash tests/ui/linux-container.sh "$stage/S3S"
          export S3S_INTEGRATION_BINARY="$RUNNER_TEMP/s3s-integration"
          go test -mod=readonly -tags=s3integration -c -o "$S3S_INTEGRATION_BINARY" ./tests/integration
          bash tests/integration/run.sh "$stage/S3S"
      - name: Upload desktop build
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Preserve this single, already verified archive as the actual download.
          # With archive disabled the artifact name comes from the file name.
          archive: false
          path: dist/s3s-${{ matrix.os }}-${{ matrix.arch }}-${{ github.sha }}.*
          if-no-files-found: error
      - name: Verify the uploaded bytes match the checked package
        env:
          UPLOAD_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          package=(dist/s3s-${{ matrix.os }}-${{ matrix.arch }}-${{ github.sha }}.*)
          node --input-type=module - "${package[@]}" <<'JS'
          import { createHash } from 'node:crypto'
          import { createReadStream } from 'node:fs'
          const [file, ...extra] = process.argv.slice(2)
          if (!file || extra.length) throw Error('Expected exactly one package')
          const hash = createHash('sha256')
          for await (const chunk of createReadStream(file)) hash.update(chunk)
          const digest = hash.digest('hex')
          if (digest !== process.env.UPLOAD_DIGEST.replace(/^sha256:/, '')) throw Error('Uploaded package digest mismatch')
          console.log(file, digest)
          JS
