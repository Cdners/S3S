name: Desktop
on:
  pull_request:
  push:
    branches: [main, "feat/**"]
permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, os: linux, arch: amd64, runner_arch: X64 }
          - { runner: windows-2025, os: windows, arch: amd64, runner_arch: X64 }
          - { runner: macos-26, os: darwin, arch: arm64, runner_arch: ARM64 }
          - { runner: macos-26-intel, os: darwin, arch: amd64, runner_arch: X64 }
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          check-latest: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check the native runner and toolchain
        run: |
          test "$RUNNER_ARCH" = "${{ matrix.runner_arch }}"
          test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = "${{ matrix.os }}/${{ matrix.arch }}"
          go version
          node --version
          npm --version
      - name: Install GTK and WebKitGTK development files
        if: runner.os == 'Linux'
        run: bash scripts/setup-linux.sh
      - name: Check Windows C compiler
        if: runner.os == 'Windows'
        run: |
          gcc --version
          gcc -dumpmachine | grep -E '^x86_64-w64-mingw32'
      - name: Check UI, language resources and Go
        run: bash scripts/check.sh
      - name: Verify S3 listing and recoverable transfers against an isolated service
        if: runner.os == 'Linux'
        run: |
          export S3S_INTEGRATION_BINARY="$RUNNER_TEMP/s3s-integration"
          go test -mod=readonly -tags=s3integration -c -o "$S3S_INTEGRATION_BINARY" ./tests/integration
          bash tests/integration/run.sh
      - name: Build native desktop archive
        run: bash scripts/build.sh
      - name: Upload desktop build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: s3s-${{ matrix.os }}-${{ matrix.arch }}-${{ github.sha }}
          path: dist/s3s-${{ matrix.os }}-${{ matrix.arch }}-${{ github.sha }}.*
          if-no-files-found: error
          compression-level: 0
